# CariSurg Week 8 — Mercer General ED Triage Classifier
# Pinned final model per Week 7 Cost-Benefit Memo (Mya Symister, 21 July 2026)

seed: 42

data:
  raw_path: "data/yaleemmlc_admissionprediction_triage.csv"
  target: "esi"
  test_size: 0.2
  valid_esi_labels: [1, 2, 3, 4, 5]
  vitals:
    - triage_vital_hr
    - triage_vital_sbp
    - triage_vital_dbp
    - triage_vital_rr
    - triage_vital_o2
    - triage_vital_temp
    - triage_glucose
  demographics_excluded:   # excluded from base feature set — fairness decision, Week 4
    - age
    - gender
    - ethnicity
    - race
    - lang
    - religion
    - maritalstatus
    - employstatus
    - insurance_status
  admin_excluded:
    - dep_name
    - arrivalmode
    - arrivalmonth
    - arrivalday
    - arrivalhour_bin
  leakage_excluded:        # only known after triage — must never enter the model
    - disposition
    - previousdispo

# ── Pinned decision (Week 7 Cost-Benefit Memo, Sec. 7) ──────────────────────
# Logistic Regression: best overall macro-F1 (0.481), full transparency,
# fastest inference (0.004ms/pred). Trade-off accepted: weaker ESI-1 recall
# (3/16 caught) vs. XGBoost's PR-AUC edge — mitigated operationally by
# treating the model as a second opinion, never an override.
final_model: logistic_regression

models:
  logistic_regression:
    max_iter: 1000
    random_state: 42
    # ASSUMPTION / UNKNOWN: the memo reports a "tuned" LR (train time 45.61s
    # vs. 14.36s baseline; precision 0.573 vs 0.571) but does not state which
    # hyperparameter(s) were searched (e.g. C, penalty, solver). Baseline
    # params are pinned here as a placeholder pending the actual tuned
    # values from the search object — do not treat this as final until
    # updated.
  decision_tree:
    random_state: 42
    class_weight: balanced
  random_forest:
    n_estimators: 200
    max_depth: null
    min_samples_leaf: 8
    max_features: null
    class_weight: balanced
    random_state: 42
  gradient_boosting:
    max_depth: 6
    learning_rate: 0.1
    max_iter: 300
    class_weight: balanced
    random_state: 42
