# CariSurg Week 8 — Mercer General ED Triage Classifier
# Pinned final model per Week 7 Cost-Benefit Memo

seed: 42

data:
  raw_path: "data/yaleemmlc_admissionprediction_triage.csv"
  target: "esi"
  test_size: 0.2
  valid_esi_labels: [1, 2, 3, 4, 5]
  vitals:
    - triage_vital_hr
    - triage_vital_sbp
    - triage_vital_dbp
    - triage_vital_rr
    - triage_vital_o2
    - triage_vital_temp
    - triage_glucose
  demographics_excluded:   # excluded from base feature set — fairness decision, Week 4
    - age
    - gender
    - ethnicity
    - race
    - lang
    - religion
    - maritalstatus
    - employstatus
    - insurance_status
  admin_excluded:
    - dep_name
    - arrivalmode
    - arrivalmonth
    - arrivalday
    - arrivalhour_bin
  leakage_excluded:        # only known after triage — must never enter the model
    - disposition
    - previousdispo

# ── Pinned decision (Week 7 Cost-Benefit Memo, Sec. 7) ──────────────────────
# Logistic Regression: best overall macro-F1 (0.481), full transparency,
# fastest inference (0.004ms/pred). Trade-off accepted: weaker ESI-1 recall
# (3/16 caught) vs. XGBoost's PR-AUC edge — mitigated operationally by
# treating the model as a second opinion, never an override.
# Tuned via RandomizedSearchCV over C in [0.01, 0.1, 1, 10], scoring f1_macro,
# cv=3 — winning value confirmed as C=0.1 (see logreg_search.best_params_).
final_model: logistic_regression


models:
  logistic_regression:
    C: 0.1                    # confirmed via logreg_search.best_params_
    max_iter: 1000
    random_state: 42
  decision_tree:
    max_depth: null           # confirmed via tree_search.best_params_
    min_samples_leaf: 8       # confirmed via tree_search.best_params_
    random_state: 42
    class_weight: balanced
  random_forest:
    n_estimators: 200
    max_depth: null
    min_samples_leaf: 8
    max_features: null
    class_weight: balanced
    random_state: 42
  gradient_boosting:
    # Pinned to the f1_macro-tuned variant (the objective used throughout
    # the rest of the module). Two other tuned variants exist and are
    # recorded in docs/model-selection.md:
    #   recall_macro: max_iter=150, max_depth=6, learning_rate=0.1 (identical to this one)
    #   esi1_pr_auc:  max_iter=150, max_depth=4, learning_rate=0.05
    max_iter: 150
    max_depth: 6
    learning_rate: 0.1
    class_weight: balanced
    random_state: 42
